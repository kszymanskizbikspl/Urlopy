# Testy automatyczne (node --test) w kontenerze — lokalnie nie trzeba mieć Node.js:
#   docker compose -f docker-compose.test.yml up --build --exit-code-from tests
# Każdy plik testów uruchamia własny serwer z pustą bazą w katalogu tymczasowym (bez wolumenu, bez .env).
services:
  tests:
    build:
      context: .
      target: test
    image: urlopy-zbiks-test
